[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "CodeAtlas"
version = "0.3.0"
description = "Offline repository intelligence and AI-context optimization tool. Reduce Claude token usage by eliminating unnecessary repository discovery. Includes advanced analysis, change tracking, and incremental updates."
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Dhiraj Pawar"}
]
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4",
    "tree-sitter>=0.23.0,<0.26",
    "tree-sitter-python>=0.23,<0.26",
    "tree-sitter-java>=0.23,<0.25",
    "tree-sitter-javascript>=0.23,<0.26",
    "tree-sitter-typescript>=0.23,<0.25",
]

[project.urls]
Homepage = "https://github.com/dhiraj-pawar/CodeAtlas"
Repository = "https://github.com/dhiraj-pawar/CodeAtlas"
Issues = "https://github.com/dhiraj-pawar/CodeAtlas/issues"

[project.scripts]
CodeAtlas = "codeatlas.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.13",
    "pyright>=1.1.409",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["codeatlas", "codeatlas.parsers", "codeatlas.exporters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git", "dist", "build", ".venv"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pyright]
include = ["codeatlas", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
